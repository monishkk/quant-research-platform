name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite is deliberately offline: every data test builds prices
      # with source="synthetic", so no market-data provider is contacted and the
      # run is deterministic. That is why only the [dev] extra is installed --
      # yfinance and jupyter are not needed to verify correctness.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      # pyproject already carries a [tool.ruff] section; before this step it was
      # configuration that nothing enforced, which is worse than no config at all
      # because it implies a standard the repository does not actually meet.
      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest -q
